<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEFT RIGHT | RIGHT TV</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c14;color:white;font-family:Arial,sans-serif}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#080c14;padding:20px}.fallback h1{font-size:8vw;margin:0}.fallback p{color:#b4c2d7}.hidden{display:none}</style></head><body>
<div id="fallback" class="fallback"><h1>RIGHT TV</h1><p>MAN CAVE SPORTS BOOK · Player ready</p><p>Waiting for remote control setup</p></div><iframe id="board" class="hidden" title="Sports board" allowfullscreen></iframe>
<script>
const board=document.getElementById('board'),fallback=document.getElementById('fallback');
const urls={upcoming:'https://caveup.pages.dev/',live:'https://testcave.pages.dev/'};
function display(value){const url=urls[value];if(!url){board.classList.add('hidden');fallback.classList.remove('hidden');board.removeAttribute('src');return}if(board.getAttribute('src')!==url)board.setAttribute('src',url);board.classList.remove('hidden');fallback.classList.add('hidden')}
const params=new URLSearchParams(location.search);display(params.get('board')||'');
</script><script type="module">
import {db,auth,ref,onValue,signInAnonymously} from './firebase.js';
const fallback=document.getElementById('fallback');
try{await signInAnonymously(auth);onValue(ref(db,'screens/right'),snapshot=>{const value=snapshot.val();if(!value)return;if(value.type==='upcoming'||value.type==='live')display(value.type);else if(value.type==='team' && value.team){const target='./team-board.html?sport='+encodeURIComponent((value.game||'').split('-')[0])+'&team='+encodeURIComponent(value.team)+'&eventId='+encodeURIComponent(value.eventId||'')+'&side=right&build=58698c72';if(board.getAttribute('src')!==target)board.setAttribute('src',target);board.classList.remove('hidden');fallback.classList.add('hidden');}else{display(null);fallback.querySelector('h1').textContent='Awaiting assignment';fallback.querySelectorAll('p')[1].textContent='No supported board selected';}},error=>{fallback.querySelectorAll('p')[1].textContent='Remote connection: '+error.code})}catch(error){fallback.querySelectorAll('p')[1].textContent='Authentication setup required'}
</script></body></html>
