<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>GTA VI | Original Artwork | Full-Screen Wing Boards</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080611;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.wing{position:fixed;inset:0;margin:0;padding:0;overflow:hidden;background:#080611}
.wing img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;border:0}
body.gallery{overflow:auto;min-height:100vh;height:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:22px 12px 35px;background:#080611}
.gallery h1{font-size:19px;margin:0;text-align:center}
.gallery .pair{display:flex;gap:8px;align-items:start;justify-content:center;width:min(100%,710px)}
.gallery iframe{display:block;width:min(44vw,310px);height:auto;aspect-ratio:9/16;border:1px solid #796391;background:#080611}
.gallery .links{display:flex;gap:20px;font-size:13px}
.gallery a{color:#f4b7db}
.gallery p{max-width:440px;text-align:center;color:#bcc1d0;font-size:12px;line-height:1.45;margin:0}
</style></head><body>
<script>
(function(){
  var mode=new URLSearchParams(location.search).get('side');
  var source=mode==='left'?'./assets/gamecenter/gta-vi-left-original.jpeg':
    mode==='right'?'./assets/gamecenter/gta-vi-right-original.jpeg':null;
  if(source){
    // Full bleed: use the original supplied JPEG; crop to the physical 9:16 display.
    document.body.innerHTML='<main class="wing"><img src="'+source+'" alt="GTA VI '+mode+' wing artwork"></main>';
    return;
  }
  document.body.className='gallery';
  document.body.innerHTML='<h1>GTA VI · FULL-SCREEN ORIGINAL ART</h1>'+
  '<div class="pair"><iframe title="Left wing full-screen preview" src="?side=left&v=fullbleed2"></iframe>'+
  '<iframe title="Right wing full-screen preview" src="?side=right&v=fullbleed2"></iframe></div>'+
  '<div class="links"><a href="?side=left&v=fullbleed2">Left wing</a><a href="?side=right&v=fullbleed2">Right wing</a></div>'+
  '<p>Your original pictures, unchanged. Both now fill the portrait TV from edge to edge. A small amount is cropped where the image proportions differ from the screen.</p>';
})();
</script></body></html>
