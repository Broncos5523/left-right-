<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEFT RIGHT | Team board renderer</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}main{width:100%;max-width:540px;min-height:100vh;margin:auto;padding:4vh 4vw;background:#000}.header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--accent);padding-bottom:10px}.team{flex:1;min-width:0}.name{font-size:clamp(19px,5vw,32px);font-weight:900;text-transform:uppercase;line-height:1}.meta{color:#bbb;font-weight:bold;margin-top:7px}.score{font-size:clamp(42px,12vw,76px);font-weight:900}.band{font-size:clamp(23px,7vw,42px);font-weight:900;font-style:italic;text-align:center;border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);padding:5px;margin:9px 0 0;text-transform:uppercase}.row{display:grid;grid-template-columns:30% 30% 40%;min-height:12vh;align-items:center;border-bottom:1px solid #777}.portrait{height:10vh;display:grid;place-items:center;color:#888;font-size:12px;text-align:center}.player{font-weight:900;text-transform:uppercase;font-size:clamp(15px,4vw,23px)}.stats{border-left:2px solid var(--accent);padding-left:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;text-align:center}.stats small{display:block;color:#bbb;font-size:clamp(10px,2.5vw,14px)}.stats b{font-size:clamp(20px,6vw,36px)}.note{color:#aeb3bd;font-size:13px;line-height:1.5;margin-top:22px}.diamond{width:75%;aspect-ratio:1;margin:35px auto;border:2px solid var(--accent);transform:rotate(45deg);display:grid;place-items:center}.diamond span{transform:rotate(-45deg);text-align:center}.placeholder{border-bottom:1px solid #666;padding:16px 0;color:#bbb} </style></head><body><main id="app"></main><script>
const p=new URLSearchParams(location.search),sport=p.get('sport')||'nba',team=p.get('team')||'Team awaiting assignment';
const conf={nba:['ON COURT',5,'#00a65a',['PTS','REB','AST']],wnba:['ON COURT',5,'#ed174b',['PTS','REB','AST']],cbb:['ON COURT',5,'#cc0033',['PTS','REB','AST']],nhl:['ON ICE',6,'#ffb81c',['G','A','+/-']],nfl:['ON OFFENSE',6,'#fb4f14',['YDS','ATT','TD']],cfb:['ON OFFENSE',6,'#cc0033',['YDS','ATT','TD']],mlb:['AT THE PLATE',4,'#bd3039',['H','AB','HR']]}[sport]||['TEAM BOARD',5,'#777',['—','—','—']];
const app=document.getElementById('app');app.style.setProperty('--accent',conf[2]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
app.innerHTML='<div class="header"><div class="team"><div class="name">'+esc(team)+'</div><div class="meta">CURRENT GAME · DATA PENDING</div></div><div class="score">—</div></div><div class="band">'+conf[0]+'</div>'+Array.from({length:conf[1]},(_,i)=>'<div class="row"><div class="portrait">HEADSHOT<br>UNAVAILABLE</div><div class="player">PLAYER<br>UNVERIFIED</div><div class="stats">'+conf[3].map(x=>'<div><small>'+x+'</small><b>—</b></div>').join('')+'</div></div>').join('')+'<p class="note">Layout development preview only. No live lineup, player statistics, headshots, team record, or score have been verified. Approved artwork will be integrated separately.</p>';
</script></body></html>
