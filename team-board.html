<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEFT RIGHT | Team board renderer</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}main{width:100%;max-width:540px;min-height:100vh;margin:auto;padding:4vh 4vw;background:#000}.header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--accent);padding-bottom:10px}.header.right-side{flex-direction:row-reverse}.logo{width:22%;max-width:110px;aspect-ratio:1;object-fit:contain;flex-shrink:0}.header .team{display:none}.team{flex:1;min-width:0}.name{font-size:clamp(19px,5vw,32px);font-weight:900;text-transform:uppercase;line-height:1}.meta{color:#bbb;font-weight:bold;margin-top:7px}.score{font-size:clamp(42px,12vw,76px);font-weight:900}.band{font-size:clamp(23px,7vw,42px);font-weight:900;font-style:italic;text-align:center;border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);padding:5px;margin:9px 0 0;text-transform:uppercase}.row{display:grid;grid-template-columns:30% 30% 40%;min-height:12vh;align-items:center;border-bottom:1px solid #777}.portrait{height:10vh;display:grid;place-items:center;color:#888;font-size:12px;text-align:center}.player{font-weight:900;text-transform:uppercase;font-size:clamp(13px,3.4vw,21px);min-width:0;overflow-wrap:normal;word-break:normal;line-height:1.12;padding-right:7px;letter-spacing:-.4px}.stats{border-left:2px solid var(--accent);padding-left:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;text-align:center}.stats small{display:block;color:#bbb;font-size:clamp(10px,2.5vw,14px)}.stats b{font-size:clamp(20px,6vw,36px)}.note{color:#aeb3bd;font-size:13px;line-height:1.5;margin-top:22px}.diamond{width:75%;aspect-ratio:1;margin:35px auto;border:2px solid var(--accent);transform:rotate(45deg);display:grid;place-items:center}.diamond span{transform:rotate(-45deg);text-align:center}.placeholder{border-bottom:1px solid #666;padding:16px 0;color:#bbb} </style></head><body><main id="app"></main><script>
const p=new URLSearchParams(location.search),sport=p.get('sport')||'nba',team=p.get('team')||'Team awaiting assignment';
const conf={nba:['ON COURT',5,'#00a65a',['PTS','REB','AST']],wnba:['ON COURT',5,'#ed174b',['PTS','REB','AST']],cbb:['ON COURT',5,'#cc0033',['PTS','REB','AST']],nhl:['ON ICE',6,'#ffb81c',['G','A','+/-']],nfl:['ON OFFENSE',6,'#fb4f14',['YDS','ATT','TD']],cfb:['ON OFFENSE',6,'#cc0033',['YDS','ATT','TD']],mlb:['AT THE PLATE',4,'#bd3039',['H','AB','HR']]}[sport]||['TEAM BOARD',5,'#777',['—','—','—']];
const sidePosition=p.get('side')==='right'?'right':'left';const app=document.getElementById('app');app.style.setProperty('--accent',conf[2]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
app.innerHTML='<div class="header '+(sidePosition==='right'?'right-side':'')+'"><img class="logo" alt="Team logo" hidden><div class="team"><div class="name">'+esc(team)+'</div><div class="meta">CURRENT GAME · DATA PENDING</div></div><div class="score">—</div></div><div class="band">'+conf[0]+'</div>'+Array.from({length:conf[1]},(_,i)=>'<div class="row"><div class="portrait">HEADSHOT<br>UNAVAILABLE</div><div class="player">PLAYER<br>UNVERIFIED</div><div class="stats">'+conf[3].map(x=>'<div><small>'+x+'</small><b>—</b></div>').join('')+'</div></div>').join('')+'<p class="note">Layout development preview only. No live lineup, player statistics, headshots, team record, or score have been verified. Approved artwork will be integrated separately.</p>';
</script><script>
if(sport==='nhl'){
 const meta=app.querySelector('.meta'),score=app.querySelector('.score'),band=app.querySelector('.band');
 band.textContent='GAME PARTICIPANTS';meta.textContent='LOOKING UP NHL GAME…';
 const abbr=team.includes('Bruins')?'BOS':team.includes('Canadiens')?'MTL':null;
 const get=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('NHL HTTP '+r.status);return r.json()};
 const plain=v=>typeof v==='object'?(v?.default||v?.en||''):v||'';
 const date=d=>{const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(p=>[p.type,p.value]));return parts.year+'-'+parts.month+'-'+parts.day};
 async function espnFallback(){
 const id=p.get('eventId');if(!id){meta.textContent='NHL MATCH NOT FOUND · MISSING GAME ID';return}
 const summary=await get('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event='+encodeURIComponent(id));
 const competitors=summary.header?.competitions?.[0]?.competitors||[];
 const match=competitors.find(x=>x.team?.displayName===team||x.team?.abbreviation===abbr);
 if(!match){meta.textContent='NHL GAME ID DID NOT MATCH TEAM';return}
 score.textContent=match.score??'—';const logo=app.querySelector('.logo');if(match.team?.logo){logo.src=match.team.logo;logo.hidden=false}
 const side=summary.boxscore?.players?.find(x=>x.team?.abbreviation===abbr);
 const athletes=(side?.statistics||[]).flatMap(group=>(group.athletes||[]).map(a=>({a,labels:group.labels||[],keys:group.keys||[]}))).slice(0,6);
 const nodes=app.querySelectorAll('.row');
 nodes.forEach((node,i)=>{
 const data=athletes[i],photo=node.querySelector('.portrait'),name=node.querySelector('.player'),labels=node.querySelectorAll('.stats small'),vals=node.querySelectorAll('.stats b');
 if(!data){name.textContent='NO VERIFIED PLAYER';photo.textContent='—';vals.forEach(v=>v.textContent='—');return}
 const athlete=data.a.athlete||{};name.textContent=athlete.displayName||'PLAYER';name.style.fontSize=(name.textContent.length>17?'clamp(11px,2.6vw,16px)':'');
 photo.textContent='';if(athlete.headshot?.href){const img=document.createElement('img');img.src=athlete.headshot.href;img.alt='';img.style.cssText='height:10vh;max-width:100%;object-fit:contain';photo.appendChild(img)}else photo.textContent='HEADSHOT UNAVAILABLE';
 const keys=data.keys.map(x=>String(x).toLowerCase()),headers=data.labels.map(x=>String(x).toLowerCase());
 const pick=(keyNames,labelNames)=>{let k=keys.findIndex(k=>keyNames.includes(k));if(k<0)k=headers.findIndex(k=>labelNames.includes(k));return k>=0?data.a.stats?.[k]??'—':'—'};
 const isGoalie=/goalie/i.test(athlete.position?.displayName||athlete.position?.name||'');
 const wanted=isGoalie?[['SV',['saves'],['sv']],['SA',['shotsagainst'],['sa']],['SV%',['savepct','savepercentage'],['sv%']]]:[['G',['goals'],['g']],['A',['assists'],['a']],['+/-',['plusminus'],['+/-']]];
 labels.forEach((v,j)=>v.textContent=wanted[j][0]);vals.forEach((v,j)=>v.textContent=pick(wanted[j][1],wanted[j][2]));
 });
 meta.textContent='ESPN BACKUP · VERIFIED GAME PARTICIPANTS';
 app.querySelector('.note').textContent='ESPN current-game box score fallback. Listed players are game participants, not verified players currently on ice. Data may be delayed.';
 }
 async function update(){
 try{
 const days=[date(new Date()),date(new Date(Date.now()-86400000))];
 const scoreboards=await Promise.all(days.map(d=>get('https://api-web.nhle.com/v1/score/'+d).catch(()=>({games:[]}))));
 const matches=scoreboards.flatMap(d=>d.games||[]);
 const game=matches.find(g=>[g.awayTeam,g.homeTeam].some(t=>plain(t?.abbrev)===abbr||team.toLowerCase().includes(String(plain(t?.name)).toLowerCase())));
 if(!game){await espnFallback();return}
 const isHome=plain(game.homeTeam?.abbrev)===abbr;const side=isHome?'home':'away';
 score.textContent=String((isHome?game.homeTeam:game.awayTeam)?.score??'—');const logo=app.querySelector('.logo');const logoUrl=(isHome?game.homeTeam:game.awayTeam)?.logo;if(logoUrl){logo.src=logoUrl;logo.hidden=false}
 const box=await get('https://api-web.nhle.com/v1/gamecenter/'+game.id+'/boxscore');
 const stats=box.playerByGameStats?.[side]||{};
 const skaters=[...(stats.forwards||[]),...(stats.defense||[])];
 const goalie=stats.goalies?.[0];
 const rows=skaters.sort((a,b)=>(b.toi||'').localeCompare(a.toi||'')).slice(0,5);
 if(goalie)rows.push(goalie);
 const nodes=app.querySelectorAll('.row');
 nodes.forEach((node,i)=>{
  const player=rows[i],photo=node.querySelector('.portrait'),name=node.querySelector('.player'),labels=node.querySelectorAll('.stats small'),vals=node.querySelectorAll('.stats b');
  if(!player){photo.textContent='—';name.textContent='NO VERIFIED PLAYER';vals.forEach(v=>v.textContent='—');return}
  name.textContent=[plain(player.firstName),plain(player.lastName)].filter(Boolean).join(' ')||'PLAYER';name.style.fontSize=(name.textContent.length>17?'clamp(11px,2.6vw,16px)':'');
  photo.textContent='';
  if(typeof player.headshot==='string' && /^https:\/\//.test(player.headshot)){const img=document.createElement('img');img.src=player.headshot;img.alt='';img.style.cssText='height:10vh;max-width:100%;object-fit:contain';img.onerror=()=>{photo.textContent='HEADSHOT UNAVAILABLE'};photo.appendChild(img)}else photo.textContent='HEADSHOT UNAVAILABLE';
  const isGoalie=player===goalie;
  const names=isGoalie?['SV','SA','SV%']:['G','A','+/-'];
  const values=isGoalie?[player.saves,player.shotsAgainst,player.savePctg]:[player.goals,player.assists,player.plusMinus];
  labels.forEach((v,j)=>v.textContent=names[j]);vals.forEach((v,j)=>v.textContent=values[j]??'—');
 });
 const state=game.gameState||'';
 meta.textContent=(state==='LIVE'||state==='CRIT'?'LIVE · ':'NHL · ')+plain((isHome?game.homeTeam:game.awayTeam)?.abbrev)+' · VERIFIED GAME STATS';
 const note=app.querySelector('.note');note.textContent='NHL game box-score participants, not confirmed current on-ice shifts. Stats update periodically; live data may be delayed. Original approved artwork remains pending.';
 }catch(e){try{await espnFallback();return}catch(ignore){}meta.textContent='NHL FEED UNAVAILABLE · RETRYING';app.querySelector('.note').textContent='NHL feed request failed; existing data retained. '+e.message}
 }
 update();setInterval(update,45000);
}
</script></body></html>
