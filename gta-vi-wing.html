<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b17">
<title>Man Cave Sports Book | GTA VI Wing Visual</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:white;font-family:Impact,"Arial Narrow",Arial,sans-serif}
body{overscroll-behavior:none}a{color:#fff}
.screen{position:absolute;inset:0;isolation:isolate;overflow:hidden;background:radial-gradient(90% 70% at 50% 22%,#e25c92 0%,#853d88 42%,#10152a 90%);}
.screen[data-side="right"]{background:radial-gradient(100% 65% at 53% 20%,#fcac7d 0%,#7044a0 42%,#08152d 90%)}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,#140e2755 45%,#04060d 83%),linear-gradient(118deg,#fa548b22,transparent 45%,#39d9fc19);pointer-events:none}
.art{position:absolute;inset:-2% -22% 18%;width:144%;height:84%;background-image:url("https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_01_square.07ts01r5ebl3a.jpg");background-repeat:no-repeat;background-size:cover;background-position:35% 25%;opacity:.92;filter:saturate(1.18) contrast(1.04);transform:scale(1.02);animation:arrival 12s ease-in-out infinite alternate}
.screen[data-side="right"] .art{background-position:67% 24%;filter:saturate(.95) contrast(1.1) hue-rotate(8deg)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#110d2233 62%,#060912 100%)}
.glow{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#ff8cbd26 0,transparent 28%,transparent 63%,#0d0921 100%)}
.screen[data-side="right"] .glow{background:linear-gradient(180deg,#8cceff26 0,transparent 32%,transparent 60%,#061529 100%)}
.edge{position:absolute;inset:2.2% 4%;border:1px solid #ffb5d144;pointer-events:none}
.screen[data-side="right"] .edge{border-color:#8feaff55}
.topline{position:absolute;left:8%;right:8%;top:5.2%;display:flex;justify-content:space-between;align-items:center;font-family:Arial,sans-serif;font-size:clamp(9px,1.45vh,18px);font-weight:900;letter-spacing:.16em;text-shadow:0 2px 8px #000}
.topline .mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff84af;box-shadow:0 0 11px #ff638f;margin-right:8px}
.screen[data-side="right"] .topline .mark{background:#65efff;box-shadow:0 0 11px #45cfff}
.vertical{position:absolute;right:7%;top:25%;writing-mode:vertical-rl;letter-spacing:.45em;font-family:Arial,sans-serif;font-size:clamp(9px,1.5vh,19px);font-weight:900;color:#f6e9ff9c}
.bottom{position:absolute;left:7%;right:7%;bottom:8%;text-align:left;text-shadow:0 4px 18px #000;}
.chip{display:inline-block;padding:6px 11px;background:#eaffffd9;color:#130d24;border-radius:3px;font-family:Arial,sans-serif;font-weight:900;letter-spacing:.15em;font-size:clamp(9px,1.6vh,22px)}
.screen[data-side="right"] .chip{background:#bdefff}
.logo{margin-top:2vh;display:flex;align-items:flex-end;gap:2%;filter:drop-shadow(0 6px 0 #080712);white-space:nowrap}
.wordmark{font-family:Impact,"Arial Black",sans-serif;letter-spacing:-.045em;font-size:clamp(38px,8.9vw,142px);line-height:.72;text-transform:uppercase}
.roman{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:900;font-size:clamp(125px,29vw,455px);line-height:.66;letter-spacing:-.09em;background:linear-gradient(140deg,#fff5ab 4%,#ffa0b8 47%,#e552a8 68%,#6535ac 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #080712)}
.screen[data-side="right"] .roman{background:linear-gradient(140deg,#b0fcff 3%,#6ed6ed 37%,#a382ff 70%,#ff8abd 100%);-webkit-background-clip:text;background-clip:text}
.character{font-size:clamp(20px,3.7vh,48px);font-weight:900;letter-spacing:.25em;margin:4.3vh 0 0;border-top:2px solid #f6ffffaa;padding-top:1.1vh}
.subtitle{font-family:Arial,sans-serif;color:#f0e4f3;font-size:clamp(9px,1.4vh,17px);letter-spacing:.19em;font-weight:800;margin-top:1.2vh}
.logo-small{position:absolute;left:7%;bottom:3.6%;font-family:Arial,sans-serif;letter-spacing:.12em;font-size:clamp(7px,1.05vh,13px);color:#ffe6f4b0}
.line{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#fb4786,#ffbf8a,#aa73ed);box-shadow:0 0 18px #ed6fe4}
.screen[data-side="right"] .line{background:linear-gradient(90deg,#6b91ff,#6df1ff,#f479ab)}
@keyframes arrival{from{transform:scale(1.02) translateY(0)}to{transform:scale(1.08) translateY(-1.2%)}}
@media(prefers-reduced-motion:reduce){.art{animation:none}}
/* Side-by-side phone/desktop review. Fullscreen wing displays remain separate documents. */
.preview{min-height:100vh;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px 40px;gap:16px;background:linear-gradient(160deg,#0b1630,#080910)}
.preview h1{font:900 20px Arial,sans-serif;letter-spacing:.08em;text-align:center;margin:0}
.preview .pair{width:min(90vw,680px);display:flex;gap:8px;justify-content:center;align-items:center}
.preview iframe{width:min(42vw,280px);aspect-ratio:9/16;border:2px solid #9d78c0;border-radius:4px;background:#140b24}
.preview .links{display:flex;gap:20px;font:800 12px Arial,sans-serif}
.preview p{font:12px/1.5 Arial,sans-serif;color:#b3bdd4;text-align:center;max-width:520px;margin:0}
@media(min-aspect-ratio:1/1){.wordmark{font-size:clamp(45px,12vh,150px)}.roman{font-size:clamp(112px,30vh,410px)}}
</style>
</head>
<body>
<script>
(function(){
  var side=new URLSearchParams(location.search).get('side');
  if(side!=='left' && side!=='right'){
    document.body.className='preview';
    document.body.innerHTML='<h1>GTA VI · TWIN PORTRAIT WING PREVIEW</h1>'
      +'<div class="pair"><iframe title="Lucia left wing" src="?side=left"></iframe><iframe title="Jason right wing" src="?side=right"></iframe></div>'
      +'<div class="links"><a href="?side=left">Full-size left wing</a><a href="?side=right">Full-size right wing</a></div>'
      +'<p>Separate Fire TV modes · no sports-board changes · official Rockstar key artwork used for this concept.</p>';
    return;
  }
  document.body.innerHTML='<main class="screen" data-side="'+side+'" aria-label="GTA VI '+side+' wing">'
    +'<div class="art" role="img" aria-label="Official GTA VI Jason and Lucia promotional art"></div>'
    +'<div class="sky"></div><div class="glow"></div><div class="edge"></div>'
    +'<div class="topline"><span><i class="mark"></i>MAN CAVE SPORTS BOOK</span><span>GTA VI</span></div>'
    +'<div class="vertical">VICE CITY · LEONIDA</div>'
    +'<div class="bottom"><span class="chip">OUT NOW</span>'
    +'<div class="logo"><div class="wordmark">grand<br>theft<br>auto</div><div class="roman">VI</div></div>'
    +'<div class="character">'+(side==='left'?'LUCIA CAMINOS':'JASON DUVAL')+'</div>'
    +'<div class="subtitle">WELCOME TO VICE CITY</div></div>'
    +'<div class="logo-small">MAN CAVE · SPECIAL SHOWCASE</div><div class="line"></div></main>';
})();
</script>
</body></html>
