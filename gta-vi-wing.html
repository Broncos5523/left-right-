<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>GTA VI | Original Art Wing Boards</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#080611;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.wing{position:fixed;inset:0;overflow:hidden;background:#080611}
.backdrop{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(24px) brightness(.42);opacity:.9}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.preview{min-height:100vh;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 12px;background:#080611}
.preview h1{margin:0;font-size:20px;text-align:center}
.preview p{margin:0;color:#c2c3d2;text-align:center;font-size:12px;max-width:420px}
.preview .pair{display:flex;gap:8px;justify-content:center;width:min(100%,700px)}
.preview iframe{width:min(45vw,300px);aspect-ratio:9/16;border:2px solid #624e78;background:#090813}
.preview .links{display:flex;gap:16px;font-size:13px}
.preview a{color:#f5bddf}
</style>
</head>
<body>
<script>
(function(){
 const mode=new URLSearchParams(location.search).get('side');
 const src=mode==='left'?'./assets/gamecenter/gta-vi-left-original.jpeg':mode==='right'?'./assets/gamecenter/gta-vi-right-original.jpeg':null;
 if(src){
  // Full original artwork is always shown, without cropping or overlays.
  // A blurred copy fills only the remaining aspect-ratio space on 9:16 TVs.
  document.body.innerHTML='<main class="wing"><img class="backdrop" src="'+src+'" alt=""><img class="poster" src="'+src+'" alt="GTA VI '+mode+' wing artwork"></main>';
 }else{
  document.body.className='preview';
  document.body.innerHTML='<h1>GTA VI · ORIGINAL ARTWORK</h1>'
   +'<div class="pair"><iframe title="Left wing GTA VI" src="?side=left"></iframe><iframe title="Right wing GTA VI" src="?side=right"></iframe></div>'
   +'<div class="links"><a href="?side=left">Left wing</a><a href="?side=right">Right wing</a></div>'
   +'<p>First supplied picture on the left · second supplied picture on the right. No generated graphics or additional text. Your other board modes are unchanged.</p>';
 }
})();
</script>
</body>
</html>
