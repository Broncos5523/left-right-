name: Verify TheRundown upcoming NBA and NCAAB pregame markets (private)
on:
  push:
    paths:
      - .github/workflows/verify-rundown-key-20261119.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe next upcoming NBA and college basketball odds
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const key=process.env.THERUNDOWN_API_KEY;
          if(!key)throw Error('THERUNDOWN_API_KEY missing');
          const date=new Date().toISOString().slice(0,10);
          for(const [sport,label] of [[4,'NBA'],[5,'NCAAB']]){
            const url='https://therundown.io/api/v2/sports/'+sport+'/events/'+date+
              '?market_ids=1,2,3&affiliate_ids=19,22,23&main_line=true&hide_closed=true';
            const res=await fetch(url,{headers:{'X-TheRundown-Key':key},signal:AbortSignal.timeout(20000)});
            if(!res.ok)throw Error(label+' HTTP '+res.status);
            const data=await res.json(),ev=data.events||[];
            const future=ev.filter(e=>Date.parse(e.event_date)>Date.now()&&e.markets?.length);
            console.log('ODDS_PROBE',JSON.stringify({
              sport:label,date,status:res.status,delay:res.headers.get('X-Data-Delay-Seconds'),
              quotaRemaining:res.headers.get('X-Datapoints-Remaining'),
              allEvents:ev.length,eventsWithMarkets:ev.filter(e=>e.markets?.length).length,
              futureWithMarkets:future.length,
              sample:future.slice(0,2).map(e=>({id:e.event_id,date:e.event_date,
                teams:e.teams.map(t=>({name:t.name,mascot:t.mascot,is_home:t.is_home,is_away:t.is_away})),
                markets:e.markets.slice(0,3).map(m=>({id:m.market_id,name:m.name,period:m.period_id,
                  participants:m.participants.slice(0,2).map(p=>({name:p.name,type:p.type,
                    lines:p.lines.slice(0,2).map(l=>({value:l.value,prices:l.prices}))}))}))}))
            }));
            await new Promise(r=>setTimeout(r,1150));
          }
          JS
