name: Probe ESPN NFL athlete season stats and roster fields
on:
  push:
    paths:
      - .github/workflows/diagnose-nfl-team-leaders-20261119.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect season stats per NFL player on Broncos and Raiders
        run: |
          node --input-type=module <<'JS'
          const ROOT='https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/';
          const get=async url=>{const r=await fetch(url,{signal:AbortSignal.timeout(11000)});return{status:r.status,data:await r.json().catch(()=>({}))}};
          for(const id of [7,13]){
            const q=await get(ROOT+id+'?enable=roster,stats');
            const a=q.data.team?.athletes||[];
            console.log('ROSTER_FIELDS',JSON.stringify({id,status:q.status,athletes:a.length,hasStatistics:a.filter(x=>x.statistics||x.stats).length,
              samples:a.filter(x=>x.position?.abbreviation==='QB'||x.position?.abbreviation==='RB'||x.position?.abbreviation==='WR'||x.position?.abbreviation==='LB').slice(0,7)
               .map(x=>({name:x.displayName,position:x.position?.abbreviation,id:x.id,keys:Object.keys(x),stats:x.statistics||x.stats}))}));
            const qb=a.find(x=>x.position?.abbreviation==='QB')||a[0];
            if(!qb)continue;
            for(const [label,url] of [
              ['athlete-stats','https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/'+qb.id+'/stats?season=2026'],
              ['athlete-splits','https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/'+qb.id+'/splits?season=2026'],
              ['athlete-core','https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/types/2/athletes/'+qb.id+'/statistics/0'],
              ['site-team-season-stats',ROOT+id+'/statistics?season=2026'],
              ['site-v3-leaders','https://site.api.espn.com/apis/site/v3/sports/football/nfl/leaders?season=2026']
            ]){
             try{const q=await get(url),d=q.data;
               console.log('STATS_ENDPOINT',JSON.stringify({id,player:qb.displayName,label,status:q.status,
                 keys:Object.keys(d||{}).slice(0,30),
                 splits:JSON.stringify(d.splits||{}).slice(0,2000),
                 categories:JSON.stringify(d.categories||d.results||d.statistics||d.leaders||{}).slice(0,2000),
                 season:JSON.stringify(d.season||d.requestedSeason||{}).slice(0,300)}));
             }catch(e){console.log('STATS_ENDPOINT_ERROR',label,String(e))}
            }
          }
          JS