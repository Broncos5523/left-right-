name: Validate full-season NFL player participation vs current roster
on:
  push:
    paths:
      - .github/workflows/diagnose-nfl-team-leaders-20261119.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check ESPN 2026 season team athlete roster and pregame game boxscores
        run: |
          node --input-type=module <<'JS'
          const get=async url=>{const r=await fetch(url,{signal:AbortSignal.timeout(12000)});return{status:r.status,data:await r.json().catch(()=>({}))}};
          for(const id of [7,13]){
           const url='https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/teams/'+id+'/athletes?limit=200';
           const {status,data}=await get(url);
           console.log('SEASON_ATHLETES',JSON.stringify({id,status,keys:Object.keys(data),count:data.count,pageCount:data.pageCount,
            sample:(data.items||[]).slice(0,3)}));
           const schedule=await get('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+id+'/schedule?season=2026');
           const past=(schedule.data.events||[]).filter(e=>Date.parse(e.date)<Date.now()-86400000);
           console.log('SEASON_PAST',JSON.stringify({id,count:past.length,events:past.slice(0,3).map(e=>({id:e.id,name:e.name,date:e.date,status:e.status,competitionStatus:e.competitions?.[0]?.status}))}));
           for(const e of past.slice(-2)){
             const sum=await get('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+e.id);
             console.log('PAST_BOXSCORE',JSON.stringify({id,event:e.id,status:sum.status,
              eventState:sum.data.header?.competitions?.[0]?.status?.type?.state,
              sides:(sum.data.boxscore?.players||[]).map(p=>({team:p.team?.displayName,id:p.team?.id,
                categories:(p.statistics||[]).map(s=>({name:s.name,keys:s.keys,labels:s.labels,
                 athletes:(s.athletes||[]).slice(0,2).map(a=>({name:a.athlete?.displayName,id:a.athlete?.id,stats:a.stats}))}))}))}));
           }
          }
          JS