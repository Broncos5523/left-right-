name: Diagnose ESPN NFL teamleaders exact player and team fields
on:
  push:
    paths:
      - .github/workflows/diagnose-nfl-team-leaders-20261119.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare Raiders and Broncos team-specific categories and athlete stats
        run: |
          node --input-type=module <<'JS'
          const base='https://site.web.api.espn.com/apis/site/v3/sports/football/nfl/teamleaders';
          for(const [id,team] of [['7','Denver'],['13','Las Vegas'],['31','New York Giants']]){
            for(const param of ['?team='+id,'?teamId='+id,'?team='+id+'&season=2026']){
             const r=await fetch(base+param,{signal:AbortSignal.timeout(12000)});
             const d=await r.json().catch(()=>({}));
             const groups=d.teamLeaders?.categories||d.categories||[];
             console.log('TEAM_LEADER_SHAPE',JSON.stringify({team,id,param,status:r.status,
              rootKeys:Object.keys(d),teamLeaders:d.teamLeaders?{id:d.teamLeaders.id,name:d.teamLeaders.name,keys:Object.keys(d.teamLeaders)}:null,
              categories:groups.map(c=>({
                category:c.name,displayName:c.displayName,abbreviation:c.abbreviation,keys:Object.keys(c),
                leaders:(c.leaders||c.athletes||[]).slice(0,2).map(l=>({
                  keys:Object.keys(l),
                  name:l.athlete?.displayName||l.athlete?.fullName||l.displayName||l.name,
                  athleteId:l.athlete?.id,athleteTeam:l.athlete?.team,
                  value:l.displayValue??l.value,
                  statistics:l.statistics,
                  athleteHeadshot:l.athlete?.headshot
                }))
              }))}));
            }
          }
          JS