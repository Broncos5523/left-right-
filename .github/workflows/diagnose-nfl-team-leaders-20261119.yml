name: Probe 2026 NFL passing rushing receiving defense per-player stats
on:
  push:
    paths:
      - .github/workflows/diagnose-nfl-team-leaders-20261119.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify per-player stat dimensions for Broncos and Raiders
        run: |
          node --input-type=module <<'JS'
          const get=async u=>{const r=await fetch(u,{signal:AbortSignal.timeout(11000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
          for(const id of [7,13]){
           const roster=await get('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+id+'?enable=roster');
           const athletes=roster.team?.athletes||[];
           const picks=['QB','RB','WR','TE','LB','DE','DT','CB','S'].map(pos=>athletes.find(a=>a.position?.abbreviation===pos)).filter(Boolean);
           for(const player of picks){
            const data=await get('https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/'+player.id+'/stats?season=2026');
            const categories=(data.categories||[]).map(c=>{
             const row=(c.statistics||[]).find(s=>s.season?.year===2026&&String(s.teamId)===String(id));
             if(!row)return null;
             return{category:c.name,statNames:c.names,values:row.stats,teamId:row.teamId,season:row.season};
            }).filter(Boolean);
            console.log('ATHLETE_STATS',JSON.stringify({teamId:id,player:player.displayName,id:player.id,position:player.position?.abbreviation,categories}));
           }
          }
          JS