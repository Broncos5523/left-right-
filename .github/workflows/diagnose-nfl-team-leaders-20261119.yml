name: Probe NFL 2026 team game-summary player boxscore leader aggregation
on:
  push:
    paths:
      - .github/workflows/diagnose-nfl-team-leaders-20261119.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare ESPN completed games boxscores for two teams
        run: |
          node --input-type=module <<'JS'
          const get=async u=>{const r=await fetch(u,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
          const base='https://site.api.espn.com/apis/site/v2/sports/football/nfl/';
          for(const id of [7,13]){
           const s=await get(base+'teams/'+id+'/schedule?season=2026');
           const done=(s.events||[]).filter(x=>x.status?.type?.state==='post'||x.status?.type?.completed).slice(-5);
           console.log('SCHEDULE_COUNTS',JSON.stringify({teamId:id,count:s.events?.length,post:done.map(x=>({id:x.id,name:x.name,date:x.date,status:x.status?.type?.state}))}));
           for(const event of done.slice(0,2)){
            const d=await get(base+'summary?event='+event.id);
            const sides=d.boxscore?.players||[];
            console.log('BOX_SCORE',JSON.stringify({teamId:id,event:event.id,keys:Object.keys(d),
              sides:sides.map(x=>({team:x.team?.displayName,id:x.team?.id,
                blocks:(x.statistics||[]).map(b=>({name:b.name,labels:b.labels,keys:b.keys,
                  first:(b.athletes||[]).slice(0,2).map(p=>({name:p.athlete?.displayName,id:p.athlete?.id,stats:p.stats}))}))}))}));
           }
          }
          JS