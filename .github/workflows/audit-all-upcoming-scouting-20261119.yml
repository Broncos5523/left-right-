name: Verify MLB and WNBA future and finished matchup reports
on:
  push:
    paths: [.github/workflows/audit-all-upcoming-scouting-20261119.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check real MLB and WNBA next favorite, final boxscore, and team leader availability
        run: |
          node --input-type=module <<'JS'
          const leagues=[
            ['MLB','baseball/mlb','bos'],['WNBA','basketball/wnba','ind']];
          const get=async u=>{try{
           const r=await fetch(u,{signal:AbortSignal.timeout(13000)});
           return {http:r.status,data:await r.json().catch(()=>({}))};
          }catch(e){return{http:0,error:String(e),data:{}}}};
          for(const [league,path,team] of leagues){
           const url='https://site.api.espn.com/apis/site/v2/sports/'+path+'/teams/'+team+'/schedule';
           const schedule=await get(url);
           const list=schedule.data.events||[];
           const future=list.filter(e=>Date.parse(e.date)>Date.now()).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
           const done=list.filter(e=>e.competitions?.[0]?.status?.type?.completed===true).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));
           console.log('OFFSEASON_SCHEDULE',JSON.stringify({league,http:schedule.http,events:list.length,
            future:future.slice(0,3).map(e=>({id:e.id,date:e.date,name:e.name,timeValid:e.timeValid,season:e.season})),
            lastFinished:done.slice(0,3).map(e=>({id:e.id,date:e.date,name:e.name}))}));
           for(const e of [future[0],done[0]].filter(Boolean)){
            const sum=await get('https://site.api.espn.com/apis/site/v2/sports/'+path+'/summary?event='+e.id);
            const groups=sum.data.leaders||[];
            const box=sum.data.boxscore||{};
            console.log('OFFSEASON_SUMMARY',JSON.stringify({league,state:Date.parse(e.date)>Date.now()?'future':'final',
             id:e.id,date:e.date,http:sum.http,
             season:sum.data.header?.season,
             teamIds:sum.data.header?.competitions?.[0]?.competitors?.map(x=>({id:x.team?.id,name:x.team?.displayName})),
             leaders:groups.map(x=>({team:x.team?.displayName,id:x.team?.id,
              categories:(x.leaders||[]).map(c=>({name:c.name,players:c.leaders?.filter(y=>y.athlete?.displayName).length||0}))})),
             boxPlayerGroups:box.players?.length||0,boxTeamGroups:box.teams?.length||0}));
           }
          }
          JS