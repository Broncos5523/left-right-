name: Verify pregame matchup team leaders all seven leagues
on:
  push:
    paths: [.github/workflows/audit-all-upcoming-scouting-20261119.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify actual ESPN game-summary players for current 2026 matchups
        run: |
          node --input-type=module <<'JS'
          const pairs=[
           ['NFL','football/nfl','401873075'],
           ['NBA','basketball/nba','401910019'],
           ['NHL','hockey/nhl','401892742'],
           ['NCAAF','football/college-football','401862830'],
           ['NCAAB','basketball/mens-college-basketball','401920517']
          ];
          for(const [league,path,event] of pairs){
           const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/'+path+'/summary?event='+event,{signal:AbortSignal.timeout(14000)});
           const d=await r.json();
           console.log('PREGAME_LEADERS_SCHEMA',JSON.stringify({league,event,status:r.status,
             teams:d.header?.competitions?.[0]?.competitors?.map(c=>({id:c.team?.id,name:c.team?.displayName})),
             leaders:(d.leaders||[]).map(group=>({
               team:group.team,
               keys:Object.keys(group),
               leaderCount:group.leaders?.length,
               categories:(group.leaders||[]).slice(0,7).map(c=>({
                keys:Object.keys(c),name:c.name,displayName:c.displayName,shortDisplayName:c.shortDisplayName,
                leaders:c.leaders?.slice(0,2),athletes:c.athletes?.slice(0,2)
               }))
             }))
           }));
          }
          JS