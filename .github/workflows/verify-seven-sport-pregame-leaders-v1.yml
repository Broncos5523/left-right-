name: Verify seven-sport upcoming scouting team leaders
on:
  push:
    paths:
      - game-wall-v47-nhl-leaders-cloudflare.js
      - game-wall-v47-home-screen.html
      - tests/seven-sport-pregame-leaders-v1.mjs
      - .github/workflows/verify-seven-sport-pregame-leaders-v1.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify all seven sports, matched team identities, shared summary cache and NHL/NFL fallbacks
        run: node --test tests/seven-sport-pregame-leaders-v1.mjs tests/nfl-pregame-leaders-v1.mjs
