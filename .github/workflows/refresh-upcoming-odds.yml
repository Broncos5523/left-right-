name: Refresh multi-book upcoming odds (optional free TheRundown)
on:
  schedule:
    # Twice-daily, ~8:20 AM and 3:20 PM Eastern in standard time.
    # Two 7-league scans/day preserve monthly free-tier quota headroom.
    - cron: "20 13,20 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/odds-rundown-adapter.mjs
      - scripts/refresh-upcoming-odds.mjs
      - tests/odds-rundown-adapter.mjs
      - .github/workflows/refresh-upcoming-odds.yml
permissions:
  contents: write
concurrency:
  group: mancave-multibook-odds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify fixture identity, market source and closed-line handling
        run: node --test tests/odds-rundown-adapter.mjs
      - name: Fetch available sportsbook odds (key never sent to browser or stored in repo)
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: node scripts/refresh-upcoming-odds.mjs
      - name: Publish refreshed public quotes only when changed
        run: |
          if [ ! -f odds-cache/therundown.json ]; then
            echo "Provider not configured; leave existing ESPN controller untouched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Save ONLY the generated public quote JSON; a runner is disposable.
          # Avoid rebase conflicts when another controller commit lands while
          # the multi-book odds requests are running.
          cp odds-cache/therundown.json "${RUNNER_TEMP}/mancave-odds-cache.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP}/mancave-odds-cache.json" odds-cache/therundown.json
            git add odds-cache/therundown.json
            if git diff --cached --quiet; then
              echo "Odds cache already up to date"; exit 0
            fi
            git commit -m "Refresh bookmaker odds in Game Center read-only cache"
            if git push origin HEAD:main; then
              echo "Published refreshed public quotes"; exit 0
            fi
            sleep 3
          done
          echo "Could not publish odds cache without conflict" >&2
          exit 1
