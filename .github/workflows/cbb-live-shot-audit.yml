name: Audit real NCAA basketball shot locations
on:
  push:
    paths:
      - .github/workflows/cbb-live-shot-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check November 17 college games against live ESPN raw play by play
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const day='20261117', league='mens-college-basketball';
          const root='https://site.api.espn.com/apis/site/v2/sports/basketball/'+league+'/';
          const get=async path=>{
            const r=await fetch(root+path,{headers:{'User-Agent':'Mozilla/5.0 (compatible; ManCaveShotCoverageAudit/1.0)','Accept':'application/json'},signal:AbortSignal.timeout(17000)});
            if(!r.ok)throw Error('ESPN '+r.status+' '+path);
            return r.json();
          };
          const id=p=>String(p?.participants?.[0]?.athlete?.id||p?.participants?.[0]?.id||p?.athletes?.[0]?.id||p?.athlete?.id||p?.athleteId||'');
          const teamId=p=>String(p?.team?.id||p?.teamId||'');
          const isShot=p=>!/(free\s*throw)/i.test((p.text||'')+' '+(p.type?.text||''))&&
            (p.shootingPlay===true||/\b(makes|misses)\b.+\b(shot|jumper|layup|dunk|tip|hook)\b/i.test(p.text||''));
          const coords=p=>{
            const x=p.coordinate?.x??p.coordinateX,y=p.coordinate?.y??p.coordinateY;
            return x!=null&&y!=null&&Number.isFinite(Number(x))&&Number.isFinite(Number(y))&&Math.abs(Number(x))<=150&&Math.abs(Number(y))<=150;
          };
          const desired=['Illinois','Duke','Michigan State','Tennessee','Kansas','UNLV','Arizona','Stanford','UC Irvine','Alabama','Kennesaw State','Marist','Army','Sacred Heart','Providence','Lehigh','Mount St','Arkansas','Indiana'];
          let games=[],status='ok',error=null,checkedAt=new Date().toISOString();
          try{
            const schedule=await get('scoreboard?dates='+day+'&limit=500');
            const all=(schedule.events||[]).map(e=>({
              id:String(e.id),state:e.status?.type?.state||'',
              status:e.status?.type?.description||'',start:e.date||'',
              teams:(e.competitions?.[0]?.competitors||[]).map(x=>x.team?.displayName||'').filter(Boolean)
            })).filter(g=>['in','post'].includes(g.state));
            const match=g=>g.teams.some(s=>desired.some(n=>s.toLowerCase().includes(n.toLowerCase())));
            const priority=all.filter(match),other=all.filter(g=>!match(g));
            const targets=[...priority.slice(0,9),...other.slice(0,Math.max(0,14-Math.min(priority.length,9)))].slice(0,14);
            console.log('SCHEDULE',JSON.stringify({total:schedule.events?.length,played:all.length,selected:targets.length,priority:priority.length}));
            const one=async g=>{
              try{
                const data=await get('summary?event='+encodeURIComponent(g.id));
                const plays=Array.isArray(data.plays)?data.plays:Array.isArray(data?.playByPlay?.plays)?data.playByPlay.plays:[];
                const shots=plays.filter(isShot),located=shots.filter(coords);
                const box=(data.boxscore?.players||[]).map(s=>({team:s.team?.displayName||'',statCategories:(s.statistics||[]).map(t=>t.name||'')}));
                return {...g,playCount:plays.length,shotCount:shots.length,locatedCount:located.length,
                  playerIds:shots.filter(p=>id(p)).length,teamIds:shots.filter(p=>teamId(p)).length,
                  misses:shots.filter(p=>!p.scoringPlay).length,makes:shots.filter(p=>p.scoringPlay).length,
                  coordinates:located.slice(0,3).map(p=>({x:p.coordinate?.x??p.coordinateX,y:p.coordinate?.y??p.coordinateY,playerId:id(p),teamId:teamId(p),text:String(p.text||'').slice(0,100)})),
                  playShape:plays[0]?Object.keys(plays[0]).slice(0,24):[],
                  boxscoreTeams:box,
                  error:null};
              }catch(e){return {...g,error:String(e?.message||e),shotCount:0,locatedCount:0,playCount:0,playerIds:0,teamIds:0};}
            };
            let next=0;const workers=Array.from({length:3},async()=>{while(next<targets.length){const t=targets[next++];games.push(await one(t));}});
            await Promise.all(workers);
            games.sort((a,b)=>a.teams.join(' ').localeCompare(b.teams.join(' ')));
          }catch(e){status='error';error=String(e?.message||e);}
          const data={checkedAt,day,league,status,error,games};
          fs.mkdirSync('research',{recursive:true});
          fs.writeFileSync('research/CBB_LIVE_AUDIT_2026-11-17.json',JSON.stringify(data,null,2)+'\n');
          const headline=['# Real NCAA College Shot-Coordinate Audit — November 17, 2026','',
            'Run UTC: '+checkedAt,'Status: '+status+(error?' — '+error:''),'',
            'This report measures ESPN play-by-play field-goal attempts, player identifiers and actual X/Y coordinates. It is NOT a complete box-score reconciliation.','',
            '| Game | State | PBP plays | Shots | Located X/Y | Player ID |',
            '|---|---|---:|---:|---:|---:|',
            ...games.map(g=>'| '+g.teams.join(' vs ').replaceAll('|','/')+' | '+(g.error?'ERROR '+g.error:g.status)+' | '+g.playCount+' | '+g.shotCount+' | '+g.locatedCount+' | '+g.playerIds+' |'),
            '', '## JSON detail','',
            'Raw samples, coordinates, source payload shape and errors: [CBB_LIVE_AUDIT_2026-11-17.json](CBB_LIVE_AUDIT_2026-11-17.json)'];
          fs.writeFileSync('research/CBB_LIVE_AUDIT_2026-11-17.md',headline.join('\n')+'\n');
          console.log('AUDIT_REPORT',JSON.stringify({checkedAt,status,error,checked:games.length,shots:games.reduce((a,g)=>a+(g.shotCount||0),0),located:games.reduce((a,g)=>a+(g.locatedCount||0),0)}));
          JS
      - name: Commit audit report only (do not modify production)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/CBB_LIVE_AUDIT_2026-11-17.json research/CBB_LIVE_AUDIT_2026-11-17.md
          git diff --cached --quiet || (git commit -m "Record November 17 college shot-location audit from ESPN" && git push)
